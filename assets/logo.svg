<svg width="760" height="200" viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Store Upload Skill">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2FF"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C5CFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- icon tile -->
  <g filter="url(#s)">
    <rect x="24" y="30" width="140" height="140" rx="34" fill="url(#g1)"/>
  </g>
  <!-- upload arrow -->
  <g fill="url(#g2)">
    <path d="M94 66 L128 104 H107 V138 H81 V104 H60 Z"/>
    <rect x="62" y="146" width="64" height="12" rx="6"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="98" font-family="SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#EDEBFF" letter-spacing="-0.5">Store&#8202;Upload</text>
  <text x="198" y="138" font-family="SF Pro Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#8A93C2" letter-spacing="2">APP STORE  ·  GOOGLE PLAY  ·  ONE CONFIG</text>

  <!-- store dots -->
  <circle cx="660" cy="70" r="26" fill="#0B0D1A" stroke="#2A2F4A" stroke-width="2"/>
  <path d="M660 56 a1 1 0 0 1 0 28 M652 74 h16" stroke="#C9D2FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="712" cy="70" r="26" fill="#0B0D1A" stroke="#2A2F4A" stroke-width="2"/>
  <path d="M704 58 l16 12 l-16 12 z" fill="#22D3EE"/>
</svg>
